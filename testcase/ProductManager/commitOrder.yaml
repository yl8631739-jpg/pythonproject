- baseInfo:
    api_name: 提交订单
    url: /coupApply/cms/placeAnOrder
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
  testCase:
    - case_name: 提交订单-正常提交
      json:
        goods_id: ${get_extract_data(goodsId,0)}
        number: 2
        propertyChildIds: '2:9'
        inviter_id: '127839112'
        price: '128'
        freight_insurance: '0.0'
        discount_code: '002399'
        consignee_info: {"name": "张三","phone": 13800000000,"address": "北京市海淀区西三环北路74号院4栋3单元1008"}
      validation:
        - eq: { 'message': '提交订单成功' }
        - eq: { 'error_code': '0000' }
      extract:
        orderNumber: $.orderNumber
        userId: $.userId
    - case_name: 提交订单-缺少商品ID
      json:
        number: 2
        propertyChildIds: '2:9'
        inviter_id: '127839112'
        price: '128'
        consignee_info: {"name": "张三","phone": 13800000000,"address": "北京市海淀区西三环北路74号院4栋3单元1008"}
      validation:
        - contains: { 'error_code' }
    - case_name: 提交订单-购买数量为0
      json:
        goods_id: ${get_extract_data(goodsId,0)}
        number: 0
        propertyChildIds: '2:9'
        inviter_id: '127839112'
        price: '128'
        consignee_info: {"name": "张三","phone": 13800000000,"address": "北京市海淀区西三环北路74号院4栋3单元1008"}
      validation:
        - contains: { 'error_code' }
    - case_name: 提交订单-缺少收货人信息
      json:
        goods_id: ${get_extract_data(goodsId,0)}
        number: 2
        propertyChildIds: '2:9'
        inviter_id: '127839112'
        price: '128'
      validation:
        - contains: { 'error_code' }
    - case_name: 提交订单-价格为负数
      json:
        goods_id: ${get_extract_data(goodsId,0)}
        number: 2
        propertyChildIds: '2:9'
        inviter_id: '127839112'
        price: '-1'
        consignee_info: {"name": "张三","phone": 13800000000,"address": "北京市海淀区西三环北路74号院4栋3单元1008"}
      validation:
        - contains: { 'error_code' }
