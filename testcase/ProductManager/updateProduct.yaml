- baseInfo:
    api_name: 商品信息更新
    url: /coupApply/cms/updateProduct
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
  testCase:
    - case_name: 正常更新商品信息
      json:
        goodsId: ${get_extract_data(goodsId,0)}
        name: 测试商品更新名称
        content: 商品描述信息更新
        price: '99.00'
        status: '1'
      validation:
        - eq: { 'error_code': '0000' }
        - eq: { 'message': '更新成功' }
    - case_name: 更新商品-缺少商品ID
      json:
        name: 测试商品更新名称
        content: 商品描述信息更新
        price: '99.00'
      validation:
        - contains: { 'error_code' }
    - case_name: 更新商品-不存在的商品ID
      json:
        goodsId: '999999999'
        name: 测试商品更新名称
        content: 商品描述信息更新
        price: '99.00'
      validation:
        - contains: { 'error_code' }
