- baseInfo:
    api_name: 订单支付
    url: /coupApply/cms/orderPay
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
  testCase:
    - case_name: 订单支付-正常支付
      json:
        orderNumber: ${get_extract_data(orderNumber)}
        userId: ${get_extract_data(userId)}
        timeStamp: ${timestamp()}
      validation:
        - contains: { 'message': '订单支付成功' }
        - contains: { 'error_code': '0000' }
    - case_name: 订单支付-缺少订单号
      json:
        userId: ${get_extract_data(userId)}
        timeStamp: ${timestamp()}
      validation:
        - contains: { 'error_code' }
    - case_name: 订单支付-不存在的订单号
      json:
        orderNumber: 'NON_EXIST_ORDER_99999'
        userId: ${get_extract_data(userId)}
        timeStamp: ${timestamp()}
      validation:
        - contains: { 'error_code' }
    - case_name: 订单支付-缺少userId
      json:
        orderNumber: ${get_extract_data(orderNumber)}
        timeStamp: ${timestamp()}
      validation:
        - contains: { 'error_code' }
