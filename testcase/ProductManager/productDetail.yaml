- baseInfo:
    api_name: 商品详情
    url: /coupApply/cms/productDetail
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
  testCase:
    - case_name: 获取商品详情-正常查询
      json:
        pro_id: ${get_extract_data(goodsId)}
        page: 1
        size: 20
      validation:
        - contains: { 'error_code': '0000' }
    - case_name: 获取商品详情-商品ID不存在
      json:
        pro_id: '999999999'
        page: 1
        size: 20
      validation:
        - contains: { 'error_code' }
    - case_name: 获取商品详情-缺少商品ID
      json:
        page: 1
        size: 20
      validation:
        - contains: { 'error_code' }
    - case_name: 获取商品详情-商品ID为空字符串
      json:
        pro_id: ''
        page: 1
        size: 20
      validation:
        - contains: { 'error_code' }
